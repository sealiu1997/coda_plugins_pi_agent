name: Compatibility
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  stable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify checker pin
        run: node --input-type=module -e "import assert from 'node:assert/strict'; import fs from 'node:fs'; assert.equal(JSON.parse(fs.readFileSync('node_modules/@coda-console/plugin-check/package.json')).version, '0.5.7')"
      - run: npm test
      - run: npm run check:coda
      - run: npm run check:fake-live
      - run: npm run check:pi:verified
      - run: git diff --exit-code
