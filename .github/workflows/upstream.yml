name: Upstream compatibility advisory
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Probe floating upstreams (advisory only)
        run: npm run probe:upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-compatibility
          path: compat-reports/
          if-no-files-found: error
          retention-days: 30
